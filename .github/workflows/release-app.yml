name: Release app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的 ref（分支或标签）。留空则用触发本工作流时所选的 ref。
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'android-36'
  NDK_VERSION: '29.0.14206865'
  TAURI_CLI_VERSION: '^2.12'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build NSIS installer
        run: npm run app:build

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}'

      - name: Point the build at the installed NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Configure signing
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" \
              "$RUNNER_TEMP/upload-keystore.jks" \
              > src-tauri/gen/android/keystore.properties
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEY_BASE64 is not set, falling back to a debug-signed APK"
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = release ]; then
            cargo tauri android build --apk --target aarch64
          else
            cargo tauri android build --apk --debug --target aarch64
          fi

      - name: Collect APK
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk"
          mkdir -p out
          cp "$apk" "out/PKUPhysU_${version}_arm64_${{ steps.signing.outputs.variant }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
